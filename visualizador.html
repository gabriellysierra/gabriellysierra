<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizador Revista | GABRIELLY SIERRA</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@200;300;400;600;700&family=Source+Sans+3:wght@300;400;600&family=Reenie+Beanie&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://use.typekit.net/sjh3ian.css">
    
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    
    <!-- CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/visualizador.css">
</head>
<body class="page-visualizador">

    <!-- BARRA DE CONTROLE SUPERIOR -->
    <header class="visualizador-header">
        <div class="header-left">
            <a href="textos.html" class="btn-back">
                <i class="fa-solid fa-arrow-left"></i> Voltar para textos
            </a>
        </div>
        <div class="header-center">
            <h1 id="doc-title" class="doc-title">Carregando documento...</h1>
        </div>
        <div class="header-right">
            <a href="textos.html" class="btn-close" aria-label="Fechar visualizador">
                <i class="fa-solid fa-xmark"></i>
            </a>
        </div>
    </header>

    <!-- ÁREA CENTRAL DO LIVRO -->
    <main class="visualizador-main">
        <!-- Navegação Flutuante Anterior (Desktop) -->
        <button id="nav-prev" class="floating-nav-btn prev" aria-label="Página anterior">
            <i class="fa-solid fa-chevron-left"></i>
        </button>

        <!-- Contêiner de renderização -->
        <div id="canvas-container" class="canvas-container">
            <div id="zoom-wrapper">
                <div id="book-scaler">
                    <div id="book" class="book-viewport">
                        <!-- Páginas injetadas dinamicamente -->
                    </div>
                </div>
            </div>
        </div>

        <!-- Navegação Flutuante Próxima (Desktop) -->
        <button id="nav-next" class="floating-nav-btn next" aria-label="Próxima página">
            <i class="fa-solid fa-chevron-right"></i>
        </button>
    </main>

    <!-- BARRA DE CONTROLES INFERIOR -->
    <footer class="visualizador-footer">
        <div class="footer-left">
            <span id="page-num" class="page-indicator">0 / 0</span>
        </div>
        <div class="footer-center">
            <div class="zoom-controls">
                <button id="btn-zoom-out" class="control-btn" aria-label="Diminuir zoom">
                    <i class="fa-solid fa-magnifying-glass-minus"></i>
                </button>
                <span id="zoom-val" class="zoom-indicator">100%</span>
                <button id="btn-zoom-in" class="control-btn" aria-label="Aumentar zoom">
                    <i class="fa-solid fa-magnifying-glass-plus"></i>
                </button>
            </div>
        </div>
        <div class="footer-right">
            <!-- Espaço para balanceamento -->
        </div>
    </footer>

    <!-- LOADER / TELA DE CARREGAMENTO -->
    <div id="loader" class="loader-overlay">
        <div class="loader-content">
            <div class="spinner"></div>
            <p id="loader-text" class="loader-text">Inicializando visualizador...</p>
        </div>
    </div>

    <!-- Bibliotecas Necessárias (PDF.js e StPageFlip) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>

    <!-- Script de Configuração e Renderização -->
    <script>
        // Configurações do Worker do PDF.js
        const pdfjsLib = window['pdfjs-dist/build/pdf'];
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        // Parâmetros da URL
        const urlParams = new URLSearchParams(window.location.search);
        const pdfUrl = urlParams.get('pdf');
        const docTitle = urlParams.get('title') || 'Visualizador';

        // Atualizar título na barra
        document.getElementById('doc-title').innerText = docTitle;
        document.title = `${docTitle} | GABRIELLY SIERRA`;

        // Configurar botões de voltar dinamicamente
        const backUrl = urlParams.get('back');
        if (backUrl) {
            const backBtn = document.querySelector('.btn-back');
            const closeBtn = document.querySelector('.btn-close');
            const backLabel = urlParams.get('backLabel') || 'Voltar';
            if (backBtn) {
                backBtn.href = backUrl;
                backBtn.innerHTML = `<i class="fa-solid fa-arrow-left"></i> ${backLabel}`;
            }
            if (closeBtn) {
                closeBtn.href = backUrl;
            }
        }

        // Referências dos Elementos
        const bookElement = document.getElementById('book');
        const bookScaler = document.getElementById('book-scaler');
        const loader = document.getElementById('loader');
        const loaderText = document.getElementById('loader-text');
        const pageIndicator = document.getElementById('page-num');

        // Botões de Navegação (Safe Checks)
        const btnPrev = document.getElementById('btn-prev');
        const btnNext = document.getElementById('btn-next');
        const navPrev = document.getElementById('nav-prev');
        const navNext = document.getElementById('nav-next');

        let pageFlip = null;
        let pdfDoc = null;
        let pageAspectRatio = 1.414; // A4 padrão por padrão (sqrt(2))

        // Estados do Zoom
        let zoomLevel = 1.0;
        const zoomStep = 0.25;
        const minZoom = 1.0;
        const maxZoom = 2.5;

        async function initViewer() {
            if (!pdfUrl) {
                loaderText.innerText = "Erro: Nenhum arquivo PDF foi especificado.";
                loader.querySelector('.spinner').style.display = 'none';
                return;
            }

            try {
                loaderText.innerText = "Conectando ao arquivo PDF...";
                const loadingTask = pdfjsLib.getDocument(pdfUrl);
                
                // Monitoramento de progresso de download
                loadingTask.onProgress = function(progress) {
                    if (progress.total > 0) {
                        const percent = Math.round((progress.loaded / progress.total) * 100);
                        loaderText.innerText = `Baixando documento: ${percent}%`;
                    }
                };

                pdfDoc = await loadingTask.promise;
                const totalPages = pdfDoc.numPages;

                // Obter a primeira página para ler o tamanho e aspect ratio
                loaderText.innerText = "Processando layout das páginas...";
                const firstPage = await pdfDoc.getPage(1);
                const originalViewport = firstPage.getViewport({ scale: 1.0 });
                pageAspectRatio = originalViewport.width / originalViewport.height;

                // Renderizar todas as páginas em canvases de alta resolução sequencialmente
                for (let i = 1; i <= totalPages; i++) {
                    loaderText.innerText = `Renderizando página ${i} de ${totalPages}...`;
                    
                    const page = await pdfDoc.getPage(i);
                    const scale = window.devicePixelRatio || 2.0; // Renderização super nítida
                    const viewport = page.getViewport({ scale: scale });

                    // Criar container da página
                    const pageDiv = document.createElement('div');
                    pageDiv.className = 'page-wrapper';
                    
                    // Criar Canvas
                    const canvas = document.createElement('canvas');
                    canvas.className = 'page-canvas';
                    const context = canvas.getContext('2d');
                    canvas.width = viewport.width;
                    canvas.height = viewport.height;
                    
                    // Renderizar página no canvas
                    const renderContext = {
                        canvasContext: context,
                        viewport: viewport
                    };
                    await page.render(renderContext).promise;
                    
                    pageDiv.appendChild(canvas);
                    bookElement.appendChild(pageDiv);
                }

                // Esconder tela de carregamento
                loader.style.opacity = '0';
                setTimeout(() => {
                    loader.style.display = 'none';
                }, 400);

                // Inicializar o Flipbook
                setupFlipbook(originalViewport.width, originalViewport.height);

            } catch (error) {
                console.error("Erro ao inicializar o leitor de PDF:", error);
                loaderText.innerHTML = `Erro ao carregar o documento.<br><small>${error.message}</small>`;
                loader.querySelector('.spinner').style.display = 'none';
            }
        }

        function setupFlipbook(baseWidth, baseHeight) {
            // Ajustar o contêiner #book baseado nas dimensões reais das páginas e tela
            resizeBookContainer();

            // Configurações do StPageFlip
            pageFlip = new St.PageFlip(bookElement, {
                width: baseWidth, 
                height: baseHeight,
                size: "stretch",
                minWidth: 250,
                maxWidth: 1200,
                minHeight: 350,
                maxHeight: 1600,
                drawShadow: true,
                showCover: true,
                usePortrait: true,
                flippingTime: 800,
                swipeDistance: 30,
                showPageCorners: true
            });

            // Carregar páginas a partir do HTML injetado
            pageFlip.loadFromHTML(document.querySelectorAll('.page-wrapper'));

            // Registrar os eventos do Flipbook para atualizar botões e indicadores
            pageFlip.on('flip', (e) => {
                updateUIState(e.data);
            });

            pageFlip.on('changeOrientation', (e) => {
                resizeBookContainer();
                updateUIState(pageFlip.getCurrentPageIndex());
            });

            // Vincular ações aos botões
            const prevActions = () => pageFlip.flipPrev();
            const nextActions = () => pageFlip.flipNext();

            if (btnPrev) btnPrev.addEventListener('click', prevActions);
            if (btnNext) btnNext.addEventListener('click', nextActions);
            navPrev.addEventListener('click', prevActions);
            navNext.addEventListener('click', nextActions);

            // Controles de zoom
            const btnZoomIn = document.getElementById('btn-zoom-in');
            const btnZoomOut = document.getElementById('btn-zoom-out');
            
            btnZoomIn.addEventListener('click', () => {
                if (zoomLevel < maxZoom) {
                    zoomLevel += zoomStep;
                    applyZoom();
                }
            });
            
            btnZoomOut.addEventListener('click', () => {
                if (zoomLevel > minZoom) {
                    zoomLevel -= zoomStep;
                    applyZoom();
                }
            });

            // Vincular evento de clicar e arrastar (panning) quando estiver com zoom
            setupDragToScroll();

            // Suporte a teclado (setas esquerda e direita)
            document.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowLeft') {
                    pageFlip.flipPrev();
                } else if (e.key === 'ArrowRight') {
                    pageFlip.flipNext();
                }
            });

            // Inicializar estado dos botões
            updateUIState(0);
        }

        function resizeBookContainer() {
            if (!pdfDoc) return;
            
            const isMobile = window.innerWidth <= 768;
            
            // Em telas largas, o livro aberto tem duas páginas (largura = 2 * página única)
            // Em mobile/retrato, o livro é exibido como página única (largura = 1 * página única)
            const bookRatio = isMobile ? pageAspectRatio : (2 * pageAspectRatio);
            
            const container = document.getElementById('canvas-container');
            // Sem margem para o livro cobrir a página inteira
            const maxW = container.clientWidth;
            const maxH = container.clientHeight;
            
            let width, height;
            
            // Calcular o maior retângulo que cabe mantendo a proporção (aspect ratio)
            if (maxW / maxH > bookRatio) {
                // Limitado pela altura
                height = maxH;
                width = height * bookRatio;
            } else {
                // Limitado pela largura
                width = maxW;
                height = width / bookRatio;
            }

            // Salvar dimensões base
            bookElement.dataset.baseWidth = Math.round(width);
            bookElement.dataset.baseHeight = Math.round(height);

            applyZoom();
        }

        function applyZoom() {
            const baseW = parseInt(bookElement.dataset.baseWidth);
            const baseH = parseInt(bookElement.dataset.baseHeight);
            if (!baseW || !baseH) return;

            const zoomWrapper = document.getElementById('zoom-wrapper');
            const canvasContainer = document.getElementById('canvas-container');
            const zoomVal = document.getElementById('zoom-val');
            
            const zoomW = Math.round(baseW * zoomLevel);
            const zoomH = Math.round(baseH * zoomLevel);
            
            zoomVal.innerText = `${Math.round(zoomLevel * 100)}%`;
            
            // Garantir que bookElement e bookScaler têm a largura base
            bookElement.style.width = baseW + 'px';
            bookElement.style.height = baseH + 'px';
            bookScaler.style.width = baseW + 'px';
            bookScaler.style.height = baseH + 'px';
            
            if (zoomLevel === 1.0) {
                // Modo normal: resetar estilos e desabilitar scroll
                zoomWrapper.style.width = 'auto';
                zoomWrapper.style.height = 'auto';
                bookScaler.style.transform = 'translate(-50%, -50%)';
                canvasContainer.style.overflow = 'hidden';
                canvasContainer.classList.remove('zoomed');
            } else {
                // Modo Zoom: aplicar escala no bookScaler de forma centralizada e permitir rolagem
                zoomWrapper.style.width = zoomW + 'px';
                zoomWrapper.style.height = zoomH + 'px';
                bookScaler.style.transform = `translate(-50%, -50%) scale(${zoomLevel})`;
                
                canvasContainer.style.overflow = 'auto';
                canvasContainer.classList.add('zoomed');
            }

            // Habilitar/Desabilitar botões
            document.getElementById('btn-zoom-in').disabled = (zoomLevel >= maxZoom);
            document.getElementById('btn-zoom-out').disabled = (zoomLevel <= minZoom);
        }

        // Função de clique e arraste para navegar pelo PDF com zoom (panning)
        function setupDragToScroll() {
            const container = document.getElementById('canvas-container');
            let isDragging = false;
            let startX, startY;
            let scrollLeft, scrollTop;

            container.addEventListener('mousedown', (e) => {
                if (zoomLevel === 1.0) return; // Só arrasta se houver zoom
                if (e.button !== 0) return; // Apenas clique esquerdo
                
                isDragging = true;
                container.classList.add('grabbing');
                
                startX = e.pageX - container.offsetLeft;
                startY = e.pageY - container.offsetTop;
                scrollLeft = container.scrollLeft;
                scrollTop = container.scrollTop;
            });

            container.addEventListener('mouseleave', () => {
                isDragging = false;
                container.classList.remove('grabbing');
            });

            container.addEventListener('mouseup', () => {
                isDragging = false;
                container.classList.remove('grabbing');
            });

            container.addEventListener('mousemove', (e) => {
                if (!isDragging || zoomLevel === 1.0) return;
                
                e.preventDefault();
                e.stopPropagation(); // Evita ativar gestos de flip do livro ao arrastar para ler
                
                const x = e.pageX - container.offsetLeft;
                const y = e.pageY - container.offsetTop;
                const walkX = (x - startX) * 1.5; // Velocidade do arraste
                const walkY = (y - startY) * 1.5;
                
                container.scrollLeft = scrollLeft - walkX;
                container.scrollTop = scrollTop - walkY;
            });
        }

        function updateUIState(currentPageIndex) {
            if (!pageFlip) return;

            const totalPages = pageFlip.getPageCount();
            const orientation = pageFlip.getOrientation();

            // Atualizar o indicador de páginas (1-indexed para o usuário)
            if (orientation === 'landscape' && currentPageIndex > 0 && currentPageIndex < totalPages - 1) {
                // Exibição de página dupla (ex: "2 - 3 de 24")
                pageIndicator.innerText = `Pág. ${currentPageIndex} - ${currentPageIndex + 1} de ${totalPages}`;
            } else if (currentPageIndex === 0) {
                pageIndicator.innerText = `Capa (1 de ${totalPages})`;
            } else if (currentPageIndex === totalPages - 1) {
                pageIndicator.innerText = `Contracapa (${totalPages} de ${totalPages})`;
            } else {
                // Página única (Mobile ou Capas)
                pageIndicator.innerText = `Pág. ${currentPageIndex + 1} de ${totalPages}`;
            }

            // Habilitar/Desabilitar botões dependendo da página
            const isFirst = currentPageIndex === 0;
            const isLast = currentPageIndex === totalPages - 1;

            if (btnPrev) btnPrev.disabled = isFirst;
            navPrev.disabled = isFirst;
            navPrev.style.opacity = isFirst ? '0' : '1';
            navPrev.style.pointerEvents = isFirst ? 'none' : 'auto';

            if (btnNext) btnNext.disabled = isLast;
            navNext.disabled = isLast;
            navNext.style.opacity = isLast ? '0' : '1';
            navNext.style.pointerEvents = isLast ? 'none' : 'auto';
        }

        // Listener de redimensionamento de janela
        window.addEventListener('resize', () => {
            if (pageFlip) {
                resizeBookContainer();
            }
        });

        // Iniciar
        window.addEventListener('DOMContentLoaded', initViewer);
    </script>
</body>
</html>
